[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgresql]
; НЕ запускаем postgres напрямую (как делалось раньше): supervisord под user=root
; стартует программу от root, а сервер PostgreSQL отказывается работать с каталогом
; данных, принадлежащим postgres ("wrong ownership") — гарантированный exit 1 и
; бесконечный рестарт до FATAL. pg_ctlcluster сам делает su на владельца данных и
; возвращает ненулевой код, только если кластер реально не поднялся.
; `tail -f --pid=$$` держит обёртку жив пока жив shell (supervisord при остановке
; шлёт TERM всей группе процессов — tail умрёт вместе с ней).
command=/bin/sh -c "pg_ctlcluster %(ENV_PG_VER)s %(ENV_PG_CLUSTER)s start && exec tail -f /dev/null --pid=$$$$"
priority=10
autostart=true
autorestart=true
stopwaitsecs=20
stdout_logfile=/var/log/supervisor/postgres.log
stderr_logfile=/var/log/supervisor/postgres_err.log

[program:backend]
directory=/app/backend/dist
command=node main.js
; ADMIN_LOGIN / ADMIN_PASSWORD наследуются от окружения supervisord:
; entrypoint source-ит /etc/env-overrides.conf и экспортирует их со
; значениями по умолчанию ('admin'/'studio2024') либо из -e/K8s env,
; поэтому они гарантированно присутствуют.
; STANDALONE задаём явно и жёстко: защита от подмешивания STANDALONE=false
; из внешних env/секретов (иначе backend падает при отсутствии Redis).
environment=STANDALONE="true"
priority=20
autostart=true
autorestart=true
startsecs=5
; при старте контейнера postgres поднимается на секунды позже backend'а —
; если БД ещё не готова, даём 6 быстрых попыток с паузами вместо одной
; (иначе NestJS ловит ECONNREFUSED, bootstrap().catch() завершает процесс
; с кодом 0 и supervisord слишком рано объявляет FATAL)
startretries=10
stdout_logfile=/var/log/supervisor/backend.log
stderr_logfile=/var/log/supervisor/backend_err.log

[program:nginx]
command=nginx -g "daemon off;"
priority=30
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx_err.log
