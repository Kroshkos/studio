[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:postgresql]
; имя кластера берём из ENV_PG_CLUSTER (entrypoint экспортирует его из pg_lsclusters),
; раньше здесь было жёстко "main" — не работало с кластером other
command=/usr/lib/postgresql/%(ENV_PG_VER)s/bin/postgres -D /var/lib/postgresql/%(ENV_PG_VER)s/%(ENV_PG_CLUSTER)s -c config_file=/etc/postgresql/%(ENV_PG_VER)s/%(ENV_PG_CLUSTER)s/postgresql.conf
priority=10
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/postgres.log
stderr_logfile=/var/log/supervisor/postgres_err.log

[program:backend]
directory=/app/backend/dist
command=node main.js
; ADMIN_LOGIN / ADMIN_PASSWORD пробрасываются из окружения контейнера
; (docker run -e ADMIN_PASSWORD=... или env в Kubernetes); если не заданы —
; используются значения по умолчанию из кода
environment=ADMIN_LOGIN="%(ENV_ADMIN_LOGIN)s",ADMIN_PASSWORD="%(ENV_ADMIN_PASSWORD)s"
priority=20
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/var/log/supervisor/backend.log
stderr_logfile=/var/log/supervisor/backend_err.log

[program:nginx]
command=nginx -g "daemon off;"
priority=30
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx_err.log
