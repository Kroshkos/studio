# Конфигурация деплоя на Amvera (https://docs.amvera.ru)
# Одно приложение: NestJS-бэкенд + раздача собранного SPA из frontend-dist.
meta:
  template: nodejs20

build:
  # Собираем бэкенд и фронтенд; результат фронтенда кладём в ./frontend-dist,
  # который бэкенд отдаёт как статику (см. src/main.ts)
  commands:
    - cd studioBack && npm install && npx prisma generate && npm run build
    - cd studio-frontend && npm install && npm run build
    - mkdir -p studioBack/frontend-dist && cp -r studio-frontend/dist/* studioBack/frontend-dist/

run:
  # Миграции БД выполняются автоматически при старте приложения
  command: npx prisma migrate deploy && node dist/main.js
  app_root: studioBack
  port: 3001
  env_vars:
    - DATABASE_URL
    - APP_KEY
    - APP_ID
    - APP_NAME
    - BASE_URL
    - FRONT_URL
    - ADMIN_LOGIN
    - ADMIN_PASSWORD
